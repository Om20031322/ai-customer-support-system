# Secret template. Copy to secret.yaml, fill real values, and never commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-customer-support
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/customer_support?schema=public"
  JWT_SECRET: "replace-with-a-long-random-secret"
  GOOGLE_CLIENT_ID: ""
  OPENAI_API_KEY: ""
  EMAIL_HOST: ""
  EMAIL_PORT: ""
  EMAIL_USER: ""
  EMAIL_PASS: ""
  EMAIL_FROM: ""
